<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conception · Tournoi EPS</title>
<style> *{box-sizing:border-box}body{margin:0;background:#f2f4f1;color:#17202b;font-family:system-ui,-apple-system,sans-serif}header{padding:20px 5vw;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:white}h1{font-size:22px;margin:0}header p{margin:0;color:#58646d}nav{display:flex;gap:8px;padding:18px 5vw;flex-wrap:wrap}button{font:inherit;border:1px solid #d7ddd9;border-radius:12px;padding:12px 16px;background:white;cursor:pointer}button.active{background:#214de3;color:white;border-color:#214de3}main{max-width:1300px;margin:auto;padding:20px 5vw}.hero{padding:42px;border-radius:24px;background:#172b36;color:white}.hero h2{font-size:clamp(28px,4vw,52px);max-width:650px;line-height:1.1;margin:20px 0}.hero button{background:#d8f882;color:#172b36;border:0}.kicker{font-size:12px;letter-spacing:2px}.bar{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#182c35;color:white;padding:22px 28px;border-radius:20px;margin-bottom:20px;flex-wrap:wrap}.time{font-size:60px;font-weight:700;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:16px}.court{position:relative;background:white;border-radius:20px;padding:20px;min-height:210px;overflow:hidden}.court header{background:transparent;padding:0;justify-content:space-between;font-size:12px;font-weight:600;position:relative;z-index:1}.state{color:#276344}.floor{position:absolute;inset:48px 18px 16px;border:2px solid #e8eeeb;border-radius:5px}.floor:before{content:'';position:absolute;left:50%;height:100%;border-left:2px solid #e8eeeb}.floor:after{content:'';position:absolute;left:32%;right:32%;top:30%;bottom:30%;border:2px solid #e8eeeb;border-radius:50%}.half .floor:before{height:44%;left:28%;right:28%;width:44%;top:0;border:2px solid #e8eeeb;border-top:0;border-radius:0 0 50% 50%}.half .floor:after{width:12px;height:12px;left:calc(50% - 6px);top:10px;border-radius:50%;border-color:#bacbc2}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;text-align:center;padding-top:38px}.team{font-weight:600}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--color);margin-right:6px}.score{font-size:clamp(32px,4vw,56px);font-weight:750;margin-top:10px}.caption{font-size:13px;color:#64716a;margin-top:14px}.compact .court{min-height:164px;padding:16px}.compact .teams{padding-top:23px}.compact .score{font-size:35px}.tv{background:#12252e;color:white;padding:30px;border-radius:22px}.tv .court{background:#203640;color:white}.tv .floor,.tv .floor:before,.tv .floor:after{border-color:#314b53}.tv .state,.tv .caption{color:#d8f882}.tv .bar{justify-content:center;text-align:center;background:transparent}.tv .time{font-size:96px}.navtabs{display:flex;gap:20px;margin:22px 0;color:#617069}.navtabs strong{color:#214de3}.homefoot{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}.homefoot div{background:white;border-radius:16px;padding:20px;flex:1}.rest{margin-top:20px;background:#e7ece7;border-radius:14px;padding:18px;color:#46574e}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.court{padding:14px;min-height:180px}.teams{padding-top:30px}.hero{padding:26px}.time{font-size:45px}.tv{padding:12px}.tv .time{font-size:62px}}@media(max-width:400px){.grid{grid-template-columns:1fr}}</style></head>
<body><div style="background:#ffd265;color:#172f29;padding:18px;font:16px Arial,sans-serif;text-align:center"><strong>Archive · maquette de la version 1.</strong> Le parcours actuel a été refait. <a href="./index.html" style="color:inherit">Ouvrir l’application</a></div><header><h1>TOURNOI <span style="color:#214de3">EPS</span></h1><p>Maquettes · avant développement · <a href="./architecture.html">Architecture et validation</a></p></header><nav aria-label="Maquettes"><button class="active" data-view="home">Accueil</button><button data-view="basket">Basket 3×3</button><button data-view="hand">Handball</button><button data-view="bad">Badminton</button><button data-view="tv">Écran TV</button></nav><main id="screen"></main>
<script>
const names=['Bleus','Rouges','Verts','Jaunes','Violets','Oranges','Roses','Turquoise','Léa','Noé','Lou','Sacha','Jade','Adam','Mila','Léo','Zoé','Maël'];const colors=['#285be1','#e55066','#2e956e','#dbb51c','#8a5bc4','#e78534','#ca5596','#299da7'];
function cards(n,sport){return `<div class="grid ${n>4?'compact':''}" style="--cols:${n>4?3:n===3?3:2}">${Array.from({length:n},(_,i)=>`<article class="court ${sport==='basket'?'half':''}"><header><span>${sport==='bad'?'TERRAIN':sport==='basket'?'DEMI-TERRAIN':'TERRAIN'} ${i+1}</span><span class="state">En cours</span></header><div class="floor" aria-hidden="true"></div><div class="teams"><div class="team"><span class="dot" style="--color:${colors[(i*2)%8]}"></span>${names[i*2]}<div class="score">${[4,2,6,8,5,3,7,9,4][i]}</div></div><div class="team"><span class="dot" style="--color:${colors[(i*2+1)%8]}"></span>${names[i*2+1]}<div class="score">${[2,3,4,5,1,6,2,8,5][i]}</div></div></div></article>`).join('')}</div>`}
function show(view){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let h='';if(view==='home'){h=`<div class="hero"><span class="kicker">LE GYMNASE, EN UN COUP D’ŒIL.</span><h2>Moins d’organisation.<br>Plus de jeu.</h2><p>Vos terrains, vos équipes, votre tournoi.</p><button data-view="basket">Créer un tournoi →</button></div><div class="homefoot"><div><strong>Reprendre un tournoi</strong><p>Basket 3×3 · 8 équipes · 4 terrains</p></div><div><strong>Où je joue ?</strong><p>Trouvez votre terrain et votre prochain match.</p></div></div>`}else if(view==='tv'){h=`<section class="tv"><div class="bar"><div><div class="kicker">HANDBALL · ROTATION 3 / 5</div><div class="time">04:22</div></div></div>${cards(3,'hand')}<div class="rest">PROCHAINE ROTATION · Bleus / Verts · Rouges / Oranges · Jaunes / Violets</div></section>`}else{let n=view==='basket'?4:view==='hand'?3:9;h=`<div class="navtabs"><strong>Terrains</strong><span>Rotations</span><span>Classement</span></div><div class="bar"><div><div class="kicker">${view==='basket'?'BASKET 3×3':view==='hand'?'HANDBALL':'BADMINTON'} · ROTATION 3</div><div class="caption" style="color:#c5d5d3">${view==='basket'?'Premier à 11 points':'Matchs de 5 minutes'}</div></div><div class="time">${view==='basket'?'11 PTS':'04:22'}</div><button>Pause générale</button></div>${cards(n,view)}<div class="rest">${view==='basket'?'4 demi-terrains · les rencontres se terminent individuellement.':view==='hand'?'3 terrains · un chrono commun.':'9 terrains · 18 joueurs · un chrono commun.'}</div>`}document.getElementById('screen').innerHTML=h}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)show(b.dataset.view)});show('home');
</script></body></html>
